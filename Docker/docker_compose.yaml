version: "3.9"

name: rag

services:

  mongo:
    image: mongo:7
    container_name: rag_mongo
    restart: unless-stopped
    ports:
      - "${MONGO_PORT}:27017"
    environment:
      MONGO_INITDB_ROOT_USERNAME: ${MONGO_USERNAME}
      MONGO_INITDB_ROOT_PASSWORD: ${MONGO_PASSWORD}
      MONGO_INITDB_DATABASE: ${MONGO_DATABASE}
    volumes:
      - mongo_data:/data/db
    networks:
      - rag_network

  qdrant:
    image: qdrant/qdrant:latest
    container_name: rag_qdrant
    restart: unless-stopped
    ports:
      - "${QDRANT_REST_PORT}:6333"
      - "${QDRANT_GRPC_PORT}:6334"
    volumes:
      - qdrant_data:/qdrant/storage
    networks:
      - rag_network

  redis:
    image: redis:8-alpine
    container_name: rag_redis
    restart: unless-stopped
    ports:
      - "${REDIS_PORT}:6379"
    command: >
      redis-server
      --requirepass ${REDIS_PASSWORD}
      --appendonly yes
      --maxmemory ${REDIS_MAX_MEMORY}
      --maxmemory-policy ${REDIS_MAX_MEMORY_POLICY}
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD}
      REDIS_MAX_MEMORY: ${REDIS_MAX_MEMORY}
      REDIS_MAX_MEMORY_POLICY: ${REDIS_MAX_MEMORY_POLICY}
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD}", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - rag_network

  rabbitmq:
    image: rabbitmq:3.13-management-alpine
    container_name: rag_rabbitmq
    restart: unless-stopped
    ports:
      - "${RABBITMQ_PORT}:5672"
      - "${RABBITMQ_MGMT_PORT}:15672"
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_USERNAME}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_PASSWORD}
      RABBITMQ_DEFAULT_VHOST: ${RABBITMQ_VHOST}
    volumes:
      - rabbitmq_data:/var/lib/rabbitmq
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 15s
      timeout: 10s
      retries: 5
    networks:
      - rag_network

  prometheus:
    image: prom/prometheus:latest
    container_name: rag_prometheus
    restart: unless-stopped
    ports:
      - "${PROMETHEUS_PORT}:9090"
    command:
      - "--config.file=/etc/prometheus/prometheus.yml"
      - "--storage.tsdb.path=/prometheus"
      - "--storage.tsdb.retention.time=15d"
      - "--web.enable-lifecycle"
    volumes:
      - ./Deployment/Monitoring/Prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./Deployment/Monitoring/Prometheus/rules:/etc/prometheus/rules:ro
      - prometheus_data:/prometheus
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://localhost:9090/-/ready"]
      interval: 15s
      timeout: 5s
      retries: 5
    networks:
      - rag_network

  grafana:
    image: grafana/grafana:latest
    container_name: rag_grafana
    restart: unless-stopped
    ports:
      - "${GRAFANA_PORT}:3000"
    environment:
      GF_SECURITY_ADMIN_USER: ${GRAFANA_ADMIN_USER}
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD}
      GF_USERS_ALLOW_SIGN_UP: "false"
    volumes:
      - grafana_data:/var/lib/grafana
      - ./Deployment/Monitoring/Grafana/provisioning:/etc/grafana/provisioning:ro
      - ./Deployment/Monitoring/Grafana/dashboards:/var/lib/grafana/dashboards:ro
    depends_on:
      prometheus:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget --spider -q http://localhost:3000/api/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - rag_network

  nginx:
      image: nginx:1.27-alpine
      container_name: rag_nginx
      restart: unless-stopped
      depends_on:
        grafana:
          condition: service_healthy  # or condition: service_started
      ports:
        - "${NGINX_HTTP_PORT}:80"
        - "${NGINX_HTTPS_PORT}:443"
      volumes:
        - ./Deployment/Nginx/nginx.conf:/etc/nginx/nginx.conf:ro
        - ./Deployment/Nginx/conf.d:/etc/nginx/conf.d:ro
        - ./Deployment/Nginx/ssl:/etc/nginx/ssl:ro
        - ./Deployment/Nginx/logs:/var/log/nginx
      extra_hosts:
        - "host.docker.internal:host-gateway"
      healthcheck:
        test: ["CMD-SHELL", "wget --spider -q http://localhost || exit 1"]
        interval: 15s
        timeout: 5s
        retries: 5
      networks:
        - rag_network

  postgres:
    image: postgres:18-alpine
    container_name: rag_postgres
    restart: unless-stopped
    ports:
      - "${POSTGRES_PORT}:5432"
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - rag_network

networks:
  rag_network:
    name: rag_network
    driver: bridge

volumes:
  postgres_data:
      name: rag_postgres_data
  mongo_data:
    name: rag_mongo_data
  qdrant_data:
    name: rag_qdrant_data
  redis_data:
    name: rag_redis_data
  rabbitmq_data:
    name: rag_rabbitmq_data
  prometheus_data:
    name: rag_prometheus_data
  grafana_data:
    name: rag_grafana_data


    